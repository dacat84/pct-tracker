name: Garmin Sync

# Runs every hour (GitHub often delays or skips scheduled runs, so more
# slots = fresher data) and whenever a diary entry is pushed (the iOS
# shortcut), so the map is current at the moment I post something.
# Where the data goes depends on `tracker.mode` in _config.yml:
# "waiting" -> data/test/ (test view at /pct-tracker/?test),
# "live" -> data/ (the public tracker). Manual runs default to a dry run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only test the Garmin login and list activities, write nothing"
        type: boolean
        default: true
  schedule:
    - cron: "41 * * * *"   # every hour
  push:
    branches: [main]
    paths: ["_updates/**"]

permissions:
  contents: write
  issues: write   # open an issue (push notification in the GitHub app) when the sync breaks

# Never two syncs at once (they would both try to commit the same files).
concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "garminconnect==0.3.20"

      # Garmin tokens: the newest (refreshed) copy is kept between runs in the
      # Actions cache, encrypted with GARMIN_TOKEN_KEY. If there is none yet,
      # the GARMIN_TOKENS secret (garmin_tokens.json from a local login) is used.
      - name: Restore refreshed Garmin tokens
        uses: actions/cache/restore@v4
        with:
          path: .garmin-cache
          key: garmin-token-${{ github.run_id }}
          restore-keys: garmin-token-

      - name: Set up Garmin token store
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
        run: |
          mkdir -p ~/.garminconnect && chmod 700 ~/.garminconnect
          if [ -f .garmin-cache/tokens.enc ] && [ -n "$GARMIN_TOKEN_KEY" ] && \
             openssl enc -d -aes-256-cbc -pbkdf2 -pass env:GARMIN_TOKEN_KEY \
               -in .garmin-cache/tokens.enc -out ~/.garminconnect/garmin_tokens.json 2>/dev/null; then
            echo "Using refreshed tokens from the previous run."
          elif [ -n "$GARMIN_TOKENS" ]; then
            printf '%s' "$GARMIN_TOKENS" > ~/.garminconnect/garmin_tokens.json
            echo "Using tokens from the GARMIN_TOKENS secret."
          else
            echo "No Garmin tokens configured."
          fi
          [ -f ~/.garminconnect/garmin_tokens.json ] && chmod 600 ~/.garminconnect/garmin_tokens.json || true
          # The secret is always kept as a second option: after a fresh login (new GARMIN_TOKENS)
          # the sync falls back to it when the cached tokens no longer work.
          if [ -n "$GARMIN_TOKENS" ]; then
            mkdir -p ~/.garminconnect-secret && chmod 700 ~/.garminconnect-secret
            printf '%s' "$GARMIN_TOKENS" > ~/.garminconnect-secret/garmin_tokens.json
            chmod 600 ~/.garminconnect-secret/garmin_tokens.json
          fi

      - name: Sync from Garmin Connect
        env:
          GARMIN_DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/garmin_sync.py

      - name: Encrypt refreshed tokens for the next run
        if: ${{ always() }}
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
        run: |
          rm -rf .garmin-cache && mkdir -p .garmin-cache
          if [ -n "$GARMIN_TOKEN_KEY" ] && [ -f ~/.garminconnect/garmin_tokens.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:GARMIN_TOKEN_KEY \
              -in ~/.garminconnect/garmin_tokens.json -out .garmin-cache/tokens.enc
          fi

      - name: Save refreshed Garmin tokens
        if: ${{ always() && hashFiles('.garmin-cache/tokens.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .garmin-cache
          key: garmin-token-${{ github.run_id }}

      - name: Commit & push if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "garmin-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/track.geojson data/latest.json data/garmin_state.json \
                   data/test/track.geojson data/test/latest.json data/test/garmin_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Auto-update track from Garmin" || exit 0
          git pull --rebase origin main   # another commit may have landed meanwhile
          git push

      # Problems show up as an issue in the repo (the GitHub app sends a push
      # notification), and the issue closes itself once a sync works again.
      - name: Report a broken sync
        if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create garmin-sync --color d93f0b --description "Garmin sync problems" 2>/dev/null || true
          if [ "$(gh issue list --label garmin-sync --state open --json number --jq length)" = "0" ]; then
            gh issue create --label garmin-sync --title "Garmin-Sync klappt nicht" --body "Der Garmin-Sync ist fehlgeschlagen: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Meistens ist der Garmin-Login abgelaufen. Neu einloggen und das Secret GARMIN_TOKENS ersetzen, siehe scripts/GARMIN_SETUP.md (auch vom Handy aus, Abschnitt Codespaces). Bis dahin kann die Position per Chat in data/manual.json eingetragen werden."
          fi

      - name: Close the issue when the sync works again
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label garmin-sync --state open --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$n" --comment "Sync läuft wieder: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
