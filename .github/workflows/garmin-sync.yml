name: Garmin Sync

# Manual for now (scaffold). Once the GARMIN_* secrets are set (see
# scripts/GARMIN_SETUP.md), uncomment the schedule block below to run it
# automatically every few hours.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only test the Garmin login and list activities, write nothing"
        type: boolean
        default: true
  # schedule:
  #   - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Pinned to the versions the token store was created with (see GARMIN_SETUP.md).
        run: pip install "garminconnect==0.2.8" "garth==0.4.47"

      - name: Restore Garmin token store (if configured)
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: |
          if [ -n "$GARMIN_TOKENS_B64" ]; then
            mkdir -p ~/.garminconnect
            echo "$GARMIN_TOKENS_B64" | base64 -d | tar -xzf - -C ~/.garminconnect
            echo "Restored cached Garmin token store."
          else
            echo "No GARMIN_TOKENS_B64 secret set; will use email/password if provided."
          fi

      - name: Sync from Garmin Connect
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/garmin_sync.py

      - name: Commit & push if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "garmin-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/track.geojson data/latest.json data/garmin_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Auto-update track from Garmin" || exit 0
          git push
