<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}" />

  <meta property="og:title" content="{{ site.title }} · {{ page.title }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233e9a51'/><path d='M5 25 L13 10 L17.5 18 L20.5 13 L27 25 Z' fill='white'/></svg>" />

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- Design test: original vs. neo (switch bottom right). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/neo.css' | relative_url }}">
  <script>
    (function(){
      var t = null;
      try {
        var q = new URLSearchParams(location.search).get('look');
        if (q === 'neo' || q === 'original') localStorage.setItem('pctLook', q);
        t = localStorage.getItem('pctLook');
      } catch (e) {}
      if (t === 'neo') document.documentElement.classList.add('neo');
    })();
  </script>
  {{ page.head_extra }}
</head>

<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">        <div class="brand-title">{{ site.title }}</div>
          <div class="brand-sub" data-en="On foot from Mexico to Canada" data-de="Zu Fuß von Mexiko nach Kanada">On foot from Mexico to Canada</div>
      </div>

      <nav class="tabs">
        <a class="tab {% if page.nav == 'map' %}active{% endif %}" href="{{ '/' | relative_url }}" data-en="Map" data-de="Karte">Map</a>
        <a class="tab {% if page.nav == 'stats' %}active{% endif %}" href="{{ '/stats.html' | relative_url }}" data-en="Stats" data-de="Statistik">Stats</a>
        <a class="tab {% if page.nav == 'photos' %}active{% endif %}" href="{{ '/photos' | relative_url }}" data-en="Photos" data-de="Fotos">Photos</a>
        <a class="tab {% if page.nav == 'updates' %}active{% endif %}" href="{{ '/updates' | relative_url }}" data-en="Diary" data-de="Tagebuch">Diary</a>
        <a class="tab {% if page.nav == 'gear' %}active{% endif %}" href="{{ '/gear' | relative_url }}" data-en="Gear" data-de="Ausrüstung">Gear</a>
        <button class="tab langtoggle" id="langToggle" type="button" aria-label="Language / Sprache">DE · EN</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Hosted on <a href="https://pages.github.com" target="_blank">GitHub Pages</a>
    </div>
  </footer>

  <script>
  (function(){
    var L=localStorage.getItem('pctLang');
    if(L!=='de'&&L!=='en'){ L=((navigator.language||'en').slice(0,2)==='de')?'de':'en'; }
    document.documentElement.lang=L;
    var ns=document.querySelectorAll('[data-en]');
    for(var i=0;i<ns.length;i++){ var v=ns[i].getAttribute('data-'+L); if(v!=null) ns[i].textContent=v; }
    var b=document.getElementById('langToggle');
    if(b){
      b.setAttribute('aria-label','Sprache / Language');
      b.innerHTML=(L==='de')?'<b>DE</b>\u00a0\u00b7\u00a0<span style="opacity:.4">EN</span>':'<span style="opacity:.4">DE</span>\u00a0\u00b7\u00a0<b>EN</b>';
      b.addEventListener('click',function(){ localStorage.setItem('pctLang', L==='de'?'en':'de'); location.reload(); });
    }
  })();
  </script>
  <button class="looksw" id="lookSwitch" type="button" aria-label="Design umschalten / Switch design">
    <span class="opt" data-look="original">Original</span><span class="sep">·</span><span class="opt" data-look="neo">Neo</span>
  </button>
  <script>
  (function(){
    var root = document.documentElement, btn = document.getElementById('lookSwitch');
    if (!btn) return;
    function paint(){
      var neo = root.classList.contains('neo');
      [].forEach.call(btn.querySelectorAll('.opt'), function(o){
        o.classList.toggle('on', (o.getAttribute('data-look') === 'neo') === neo);
      });
    }
    btn.addEventListener('click', function(){
      var neo = !root.classList.contains('neo');
      root.classList.toggle('neo', neo);
      try { localStorage.setItem('pctLook', neo ? 'neo' : 'original'); } catch (e) {}
      paint();
      // let the map and the elevation profile re-measure after the font change
      setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 60);
    });
    paint();
  })();
  </script>
  {{ page.body_extra }}
</body>
</html>
