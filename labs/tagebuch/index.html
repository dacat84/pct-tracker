<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PCT Labs · Tagebuch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233a8089'/><path d='M3 26 L12 12 L16 18 L21 10 L29 26 Z' fill='%23f4f1e8'/><path d='M10 6 L6.4 13 L8.4 13 L5.6 18 L8 18 L5 24 L15 24 L12 18 L14.4 18 L11.6 13 L13.6 13 Z' fill='%2316201f' stroke='%2316201f' stroke-width='.6' stroke-linejoin='round'/><rect x='9.2' y='24' width='1.6' height='4' fill='%2316201f'/></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#efe8d8;color:#1d2a33;font-family:'Source Serif 4',Georgia,serif;overflow:hidden;display:flex}
.mapwrap{flex:1;position:relative;padding:14px}
.mapwrap .frame{position:absolute;inset:14px;border:1px solid #1d2a33;outline:1px solid #1d2a33;outline-offset:5px;pointer-events:none;z-index:3}
#map{position:absolute;inset:20px}
#map canvas{filter:sepia(.28) saturate(.75) contrast(.95)}
.plate{position:absolute;left:40px;top:40px;z-index:4;background:#f6f1e4;border:1px solid #1d2a33;padding:14px 20px 12px;max-width:360px}
.plate .k{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#56636d}
.plate h1{font-size:28px;font-weight:700;margin:6px 0 4px}
.plate p{font-style:italic;color:#4a5560;margin:0;font-size:15px}
.side{width:460px;flex:none;display:flex;flex-direction:column;border-left:1px solid #1d2a33;background:#f3ecdc;background-image:repeating-linear-gradient(#f3ecdc 0 27px,#e6dcc6 27px 28px)}
.sh{padding:26px 28px 10px;background:#f3ecdc}
.sh .t{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1d2a33;padding-bottom:8px}
.sh h2{font-size:28px;margin:0;font-weight:700}
.sh .t span{font:400 12.5px 'IBM Plex Mono',monospace;color:#56636d}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 0 6px}
.kp div{font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#56636d}
.kp b{display:block;font:700 30px 'Source Serif 4',serif;letter-spacing:0;text-transform:none;color:#1d2a33;margin-top:4px}
.kp b small{font-size:13px;font-weight:400;color:#56636d}
.list{flex:1;overflow-y:auto;padding:4px 28px 20px}
.e{padding:14px 0 16px;border-bottom:1px dashed #b9ad93;cursor:pointer}
.e:hover{background:rgba(255,255,255,.35)}
.e.on{background:rgba(224,69,47,.08);box-shadow:inset 3px 0 0 #c0392b;padding-left:12px;margin-left:-12px}
.e .d{font:500 12px 'IBM Plex Mono',monospace;color:#c0392b}
.e .w{font:400 11.5px 'IBM Plex Mono',monospace;color:#56636d;margin:2px 0 6px}
.e .x{font-size:16px;line-height:1.55}
.e .x p{margin:0 0 8px}
.e .ph{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.e .ph i{width:76px;height:76px;background:#d8cfbb center/cover;border:1px solid #1d2a33;cursor:zoom-in}
.foot{border-top:2px solid #1d2a33;padding:12px 28px 16px;background:#f3ecdc}
.foot .row{display:flex;align-items:center;gap:12px}
#play{all:unset;width:44px;height:38px;background:#1d2a33;color:#f3ecdc;display:grid;place-items:center;cursor:pointer;font-size:14px}
#speed{all:unset;border:1px solid #1d2a33;padding:8px 10px;font:500 13px 'IBM Plex Mono',monospace;cursor:pointer}
#slider{flex:1;accent-color:#c0392b}
#clock{font:400 12.5px 'IBM Plex Mono',monospace;color:#56636d;margin-top:8px}
.lm{font:600 11.5px 'Source Serif 4',serif;color:#1d2a33;text-shadow:0 0 3px #f3ecdc,0 0 6px #f3ecdc;white-space:nowrap;display:flex;align-items:center;gap:5px;pointer-events:none}
.lm i{width:7px;height:7px;border:1.5px solid #1d2a33;border-radius:50%;background:#f3ecdc}
.lm.term i,.lm.town i{background:#1d2a33}
#map.z-lo .lm.t2,#map.z-lo .lm.t3,#map.z-mid .lm.t3{display:none}
.me{width:16px;height:16px;border-radius:50%;background:#c0392b;border:3px solid #f3ecdc;box-shadow:0 0 0 1.5px #1d2a33}
.phm{width:30px;height:30px;border:2px solid #f3ecdc;outline:1px solid #1d2a33;background:#d8cfbb center/cover;cursor:zoom-in}
.maplibregl-ctrl-group{border-radius:0!important;border:1px solid #1d2a33;box-shadow:none!important}
@media(max-width:860px){
  body{flex-direction:column;overflow:auto}
  .mapwrap{flex:none;height:46vh;padding:8px}.mapwrap .frame{inset:8px}#map{inset:12px}
  .plate{left:22px;top:22px;padding:8px 12px;max-width:70%}.plate h1{font-size:20px}.plate p{display:none}
  .side{width:auto;border-left:0;border-top:1px solid #1d2a33}
  .list{overflow:visible}.sh{padding:16px 18px 6px}.list{padding:4px 18px 80px}.foot{position:sticky;bottom:0;padding:10px 18px 12px}
}
</style>
</head>
<body>
<div class="mapwrap">
  <div id="map"></div>
  <div class="frame"></div>
  <div class="plate"><div class="k">Pacific Crest Trail · 2027</div><h1 id="pTitle">Campo → Kanada</h1><p id="pSub">4.265 km zu Fuß von Mexiko nach Kanada</p></div>
</div>
<div class="side">
  <div class="sh">
    <div class="t"><h2>Tagebuch</h2><span id="sheet">–</span></div>
    <div class="kp">
      <div>Etappe<b id="kDay">–</b></div>
      <div>Höhenmeter<b id="kUp">–</b></div>
      <div>Gesamt<b id="kTot">–</b></div>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div class="foot">
    <div class="row"><button id="play" title="Abspielen (Leertaste)">▶</button><input type="range" id="slider" min="0" max="0" value="0"><button id="speed">1×</button></div>
    <div id="clock"></div>
  </div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="../pct.js?v=10"></script>
<script>
(function () {
  var L = PCTLab, nf = L.nf, $ = function (id) { return document.getElementById(id); };
  L.switcher(1);
  var map = new maplibregl.Map({
    container: "map", center: [-116.47, 32.59], zoom: 9, attributionControl: { compact: true },
    style: { version: 8, sources: {
      topo: { type: "raster", tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, attribution: "Esri, HERE, Garmin, USGS" } },
      layers: [{ id: "topo", type: "raster", source: "topo" }] }
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
  map.on("zoom", function () { var z = map.getZoom(), el = $("map"); el.classList.toggle("z-lo", z < 7.5); el.classList.toggle("z-mid", z >= 7.5 && z < 10); });

  function dLong(s) { var d = new Date(String(s).trim().replace(" ", "T")); return isNaN(d) ? s : d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
  function esc(s) { return String(s || "").replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

  Promise.all([L.load(), new Promise(function (r) { map.on("load", r); }), L.photos()]).then(function (r) {
    var D = r[0], ph = r[2], first = D.days.length ? D.days[0].date : null;

    map.addSource("pct", { type: "geojson", data: D.line });
    map.addLayer({ id: "pct", type: "line", source: "pct", paint: { "line-color": "#1d2a33", "line-width": 1.4, "line-dasharray": [1, 2] } });
    map.addSource("trk", { type: "geojson", data: D.track });
    map.addLayer({ id: "trk", type: "line", source: "trk", paint: { "line-color": L.dayColor("#c0392b", "#2c5d8f"), "line-width": 3 }, layout: { "line-cap": "round", "line-join": "round" } });
    L.addCamps(map, D, { fill: "#f3ecdc", ink: "#1d2a33" });
    D.landmarks.filter(function (l) { return l.type !== "town"; }).forEach(function (l) {
      var el = document.createElement("div"); el.className = "lm " + l.type + " t" + l.tier; el.innerHTML = "<i></i>" + l.name;
      new maplibregl.Marker({ element: el, anchor: "left", offset: [-4, 0] }).setLngLat([l.lon, l.lat]).addTo(map);
    });
    ph.filter(function (p) { return p.lat && p.lon; }).forEach(function (p) {
      var el = document.createElement("div"); el.className = "phm"; el.style.backgroundImage = "url(" + p.q + ")";
      el.onclick = function () { L.lightbox(ph, ph.indexOf(p)); };
      new maplibregl.Marker({ element: el }).setLngLat([p.lon, p.lat]).addTo(map);
    });
    L.addTowns(map, D, { dot: "#c0392b", text: "#1d2a33", halo: "0 0 3px #f3ecdc,0 0 6px #f3ecdc", link: "#1d2a33" });
    var pos = D.latest && typeof D.latest.lat === "number" ? [D.latest.lon, D.latest.lat] : [D.here.lon, D.here.lat];
    var me = document.createElement("div"); me.className = "me";
    var mk = new maplibregl.Marker({ element: me }).setLngLat(pos).addTo(map);
    map.jumpTo({ center: pos, zoom: D.track.features.length ? 10.5 : 9 });

    // entries, newest first; photos of the same day underneath
    var list = $("list");
    if (!D.diary.length) list.innerHTML = '<div class="e"><div class="x">Noch keine Einträge.</div></div>';
    D.diary.forEach(function (u, i) {
      var day = String(u.date).slice(0, 10), pics = ph.filter(function (p) { return String(p.taken || "").slice(0, 10) === day; });
      var where = first && day >= first ? "auf dem Trail" : "Vorbereitung";
      var el = document.createElement("div"); el.className = "e"; el.dataset.day = day;
      el.innerHTML = '<div class="d">' + dLong(u.date) + '</div><div class="w">' + where + '</div><div class="x">' +
        String(u.de || "").split(/\n+/).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div>" +
        (pics.length ? '<div class="ph">' + pics.map(function (p) { return '<i style="background-image:url(' + p.q + ')" data-i="' + ph.indexOf(p) + '"></i>'; }).join("") + "</div>" : "");
      el.querySelectorAll(".ph i").forEach(function (t) { t.onclick = function (e) { e.stopPropagation(); L.lightbox(ph, +t.dataset.i); }; });
      el.onclick = function () {
        list.querySelectorAll(".e.on").forEach(function (x) { x.classList.remove("on"); }); el.classList.add("on");
        var c = rp.toDate(day); map.flyTo({ center: c || [D.pts[0].lon, D.pts[0].lat], zoom: c ? 11 : 9, duration: 1000 });
      };
      list.appendChild(el);
    });

    var rp = L.replay({ map: map, D: D, marker: mk, ui: { play: $("play"), speed: $("speed"), clock: $("clock"), slider: $("slider") },
      onUpdate: function (s) {
        $("sheet").textContent = "Blatt " + (s.dayNo || 0) + " · " + new Date(s.date + "T12:00").toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "short" });
        $("kDay").innerHTML = (s.day ? nf(s.day.km, 1) : "0") + "<small> km</small>";
        $("kUp").innerHTML = (s.day ? nf(s.day.up) : "0") + "<small> m</small>";
        $("kTot").innerHTML = nf(s.km) + "<small> km</small>";
        var sn = null, best = 1e9; D.pts.forEach(function (p) { var d = Math.abs(p.lat - s.lnglat[1]) + Math.abs(p.lon - s.lnglat[0]); if (d < best) { best = d; sn = p; } });
        var g = D.regions.find(function (x) { return sn && sn.km >= x.ka && sn.km < x.kb; });
        if (g) { $("pTitle").textContent = g.de; $("pSub").textContent = "Tag " + s.dayNo + " · km " + nf(sn.km) + " von " + nf(D.total); }
      } });
    if (!D.track.features.length) { $("sheet").textContent = "Vor dem Start"; $("clock").textContent = "Noch keine Aufzeichnung, Start am 22. April 2027"; $("kDay").innerHTML = $("kUp").innerHTML = $("kTot").innerHTML = "0"; }
  });
})();
</script>
</body>
</html>
