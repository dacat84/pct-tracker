title: "PCT Tracker"
description: "Following a Pacific Crest Trail thru-hike, from Mexico to Canada."
url: ""  # GitHub Pages sets this
baseurl: "/pct-tracker"  # set to "/REPO_NAME" if needed
markdown: kramdown
theme: null

# LighterPack list shown on the Gear page (lighterpack.com/r/<id>).
# The gear cards sync from it automatically (scripts/gear_sync.py).
lighterpack_id: qr1evs
permalink: pretty

# Tracker state.
#   waiting = before the hike: marker at Campo, countdown, Garmin test
#             hikes go to data/test/ (only visible at /pct-tracker/?test)
#   live    = on trail: Garmin writes data/, only activities from start on
tracker:
  mode: waiting
  start: "2027-04-15"   # countdown target; the page only says "April 2027"

collections:
  updates:
    output: false
